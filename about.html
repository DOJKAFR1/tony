<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#d94b8a">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<body>

<div data-tc-header></div>

<main data-page-body="about"></main>

<div data-tc-footer></div>

<script src="assets/js/art.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>

<script src="assets/js/app.js"></script>
<script src="assets/js/info.js"></script>
<script>
  (function () {
    var TC = window.TC;
    var wrap = document.querySelector('[data-features]');
    if (wrap) {
      wrap.innerHTML = [
        { i: 'shield', t: 'أصلي 100٪', s: 'من الموزّع المعتمد' },
        { i: 'truck',  t: 'شحن سريع',   s: 'خلال 24 – 72 ساعة' },
        { i: 'refresh',t: 'إرجاع مجاني', s: 'خلال 14 يوم' },
        { i: 'headset',t: 'دعم واتساب',  s: 'رد خلال دقائق' }
      ].map(function (f) {
        return '<div class="feature"><span class="feature__icon">' + TC.icon(f.i) + '</span>' +
          '<span><span class="feature__title">' + f.t + '</span>' +
          '<span class="feature__text">' + f.s + '</span></span></div>';
      }).join('');
    }
  })();
</script>
