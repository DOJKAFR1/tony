<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البحث | تونى كوزمتكس</title>
<meta name="description" content="ابحث عن عطور، مسك، مكياج وعناية بالبشرة في متجر تونى كوزمتكس.">
<meta name="theme-color" content="#d94b8a">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div data-tc-header></div>

<main>
  <div class="page-head">
    <div class="container">
      <nav class="crumbs" aria-label="مسار التصفح" data-crumbs></nav>
      <div class="row-between" style="margin-top:12px;flex-wrap:wrap;gap:10px">
        <h1 class="h-lg" data-title>البحث</h1>
        <p class="small muted" data-desc></p>
      </div>

      <div class="search-wrap" style="margin-top:14px">
        <div class="search-head" style="margin:0">
          <div style="position:relative;flex:1">
            <input class="input" type="search" data-q placeholder="ابحث عن منتج، ماركة، أو نوع عطر…" aria-label="ابحث في المتجر" style="padding-inline-start:46px">
            <span style="position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--tc-text-3);pointer-events:none">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            </span>
            <div class="search-sug hidden" data-sug></div>
          </div>
          <button class="btn btn--dark" data-go>بحث</button>
        </div>
        <div class="quick-tags" data-quick></div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="shop" style="grid-template-columns:1fr">
      <section>
        <div class="shop__bar">
          <span class="shop__count" data-count></span>
          <div class="shop__tools">
            <select class="select" data-sort aria-label="ترتيب حسب">
              <option value="featured">الترتيب: المميّز</option>
              <option value="price-asc">السعر: من الأقل للأعلى</option>
              <option value="price-desc">السعر: من الأعلى للأقل</option>
              <option value="rating">الأعلى تقييماً</option>
            </select>
          </div>
        </div>
        <div class="chips" data-chips></div>
        <div class="p-grid" data-results></div>
        <div data-pagination></div>
      </section>
    </div>
  </div>
</main>

<div data-tc-footer></div>

<script src="assets/js/art.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/content.local.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/collection.js"></script>
</body>
</html>
